<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model-1</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>


<body>

    <form class="form-field">
        <!-- Label and Input Field -->
        <div class="field field-primary">
          <label for="name" class="field-label">Name</label>
          <input type="text" id="name" class="field-text" placeholder="Enter your name" />
        </div>
      
        <!-- Label and Select Field -->
        <div class="field field-success">
          <label for="options" class="field-label">Options</label>
          <select id="options" class="field-select">
            <option value="" disabled selected>Select an option</option>
            <option value="1">Option 1</option>
            <option value="2">Option 2</option>
            <option value="3">Option 3</option>
          </select>
        </div>
      
        <!-- Label and Textarea Field -->
        <div class="field field-warning">
          <label for="message" class="field-label">Message</label>
          <textarea id="message" class="field-textarea" placeholder="Write your message"></textarea>
        </div>
      
        <!-- Inline Fields -->
        <div class="field field-inline">
          <label for="email" class="field-label">Email</label>
          <input type="email" id="email" class="field-text" placeholder="Enter your email" />
        </div>
      
        <!-- Small Field -->
        <div class="field field-sm field-secondary">
          <label for="phone" class="field-label">Phone</label>
          <input type="tel" id="phone" class="field-text" placeholder="Enter your phone" />
        </div>
      
        <!-- Large Field -->
        <div class="field field-lg field-danger">
          <label for="address" class="field-label">Address</label>
          <input type="text" id="address" class="field-text" placeholder="Enter your address" />
        </div>
      
        <!-- Error and Hint Text -->
        <div>
          <span class="field-error-text">This is an error message.</span>
          <span class="field-hint-text">This is a hint message.</span>
        </div>
      
        <!-- Submit Button -->
        <button type="submit" class="btn btn-light">Submit</button>
      </form>
      
    
    <script src="../js/main.js"></script>
</body>

</html>
