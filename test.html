<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag drop</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<style>
  .form-input-group {
    margin: 15px 0;
    width: 100%;
    position: relative;
    display: flex;
  }

  .form-input {
    width: 100%;
    padding: 10px;
    color: var(--border);
    border: 2px solid var(--border);
    border-radius: 5px;
    transition: border 0.25s ease-in-out;
    outline: none;

    &:focus {
      border: 2px solid var(--primary);
    }
  }

  .form-input-label {
    position: absolute;
    top: 0;
    left: 10px;
    transform: translateY(-50%);
    color: var(--border);
    background-color: var(--body);
    font-size: 14px;
    padding: 0 10px;
    transition: all 0.25s ease-in-out;
  }

  .form-input:focus~.form-input-label {
    color: var(--primary);  
  }
</style>

<body>
  <div class="form-input-group">
    <input class="form-input" type="text" placeholder="#sadfjksj">
    <label class="form-input-label">Lastname *</label>
  </div>

  <div class="form-input-group">
    <input class="form-input" type="password" placeholder="******">
    <label class="form-input-label">Password *</label>
  </div>

</body>

</html>
