    <div class="boxed mt-4 mb-4">

            </div>

            </div>

              <span>6 Guests</span>
            </div>
            <div class="btnns">
              <span class="badge badge-warning">Reserved</span>
            </div>
          </div>
        </div>
        <div class="inner-cards">
          <div class="inner-card"></div>
          <div class="inner-card"></div>
          <div class="inner-card"></div>
        </div>
      </div>
    </div>

    <div class="boxed mt-4 mb-4">

          </div>

        <div class="inner-card"></div>
        <div class="inner-card"></div>
        <div class="inner-card"></div>
      </div>
    </div>
